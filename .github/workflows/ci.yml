# Proves the skill installs and passes its tests on a machine that isn't the developer's:
# a clean install from the lockfile, type-checking and the tests, on the oldest supported Node
# (22.18, the first 22.x that strips TypeScript types by default) and the current LTS.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["22.18.0", "24"]
    defaults:
      run:
        working-directory: wiki-interest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: wiki-interest/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
